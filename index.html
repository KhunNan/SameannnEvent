<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เสมียนออนไลน์ - ระบบหารค่าอาหาร</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #f4f4f6;
            color: #111;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 10px;
        }

        /* Container การ์ดหลัก สไตล์เหมือนรูปภาพที่แนบมา */
        .app-card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            overflow: hidden;
            position: relative;
            border: 1px solid #eaeaea;
        }

        /* แถบ Gradient ด้านบนแบบในรูป */
        .header-gradient {
            height: 12px;
            background: linear-gradient(90deg, #4de0e8 0%, #7d52e8 100%);
        }

        .content {
            padding: 24px;
        }

        /* Title Style */
        .brand-title {
            font-family: 'Syne', 'Prompt', sans-serif;
            font-size: 32px;
            font-weight: 800;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 5px;
            color: #000;
        }

        .sub-title {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* Section Block */
        .section-box {
            background: #fafafa;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000;
            padding-bottom: 4px;
        }

        .date-badge {
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }

        /* Profile Selection Style */
        .friends-list {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .friend-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
        }

        .friend-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ddd;
            transition: all 0.2s;
        }

        .friend-name {
            font-size: 12px;
            margin-top: 4px;
            font-weight: 600;
        }

        /* Food & Drink List Items */
        .item-row {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .item-category {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
            margin-left: 6px;
        }
        .cat-food { background: #ffe3e3; color: #d6336c; }
        .cat-drink { background: #e7f5ff; color: #1c7ed6; }

        .item-sharers {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 12px;
            color: #666;
        }

        /* Profile selector inside item */
        .select-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            opacity: 0.3;
            filter: grayscale(100%);
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .select-avatar.active {
            opacity: 1;
            filter: grayscale(0%);
            border-color: #000;
            transform: scale(1.1);
        }

        /* Devide cost per person (Summary Cards) */
        .person-summary-card {
            display: flex;
            align-items: center;
            background: #fff;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #eaeaea;
        }

        .person-summary-card img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            margin-right: 12px;
        }

        .person-details {
            flex-grow: 1;
        }

        .person-name {
            font-weight: 700;
            font-size: 15px;
        }

        .person-breakdown {
            font-size: 11px;
            color: #777;
        }

        .person-total {
            font-size: 16px;
            font-weight: 800;
            color: #000;
            text-align: right;
        }

        /* Grand Total Box */
        .total-box {
            background: #000;
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .total-box .label {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .total-box .price {
            font-size: 22px;
            font-weight: 800;
            font-family: 'Syne', sans-serif;
        }

        /* Payment Section */
        .payment-box {
            text-align: center;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            border: 1px dashed #ccc;
        }

        .qr-placeholder {
            width: 140px;
            height: 140px;
            background: #eee;
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 12px;
            color: #888;
        }

        .promptpay-details {
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="app-card">
        <!-- แถบสีสดใสตามธีมตัวอย่าง -->
        <div class="header-gradient"></div>

        <div class="content">
            <!-- Header -->
            <div class="brand-title">เสมียน<br>ออนไลน์</div>
            <div class="sub-title">ระบบหารค่าอาหาร & เครื่องดื่ม</div>

            <!-- 1. Event Section -->
            <div class="section-box">
                <div class="section-title">
                    <span>1. Event</span>
                    <span class="date-badge" id="event-date">18 MAY 2025</span>
                </div>
                
                <!-- Food & Drink List -->
                <div id="items-container">
                    <!-- รายการจะถูกสร้างผ่าน JavaScript -->
                </div>

                <!-- Total Cost Summary -->
                <div class="total-box">
                    <span class="label">Total Cost</span>
                    <span class="price" id="grand-total">0 ฿</span>
                </div>
            </div>

            <!-- 2. Devide cost per person -->
            <div class="section-box">
                <div class="section-title">2. Divide Cost Per Person</div>
                <p style="font-size: 11px; color: #666; margin-bottom: 10px;">คำนวณแยกตามรายการที่แต่ละคนเลือกกิน/ดื่ม</p>
                
                <div id="friends-summary-container">
                    <!-- แสดงรูปและยอดเงินรวมของเพื่อนแต่ละคน -->
                </div>
            </div>

            <!-- 3. Payment Section -->
            <div class="section-box" style="margin-bottom: 0;">
                <div class="section-title">3. Payment</div>
                <div class="payment-box">
                    <p style="font-size: 12px; color: #555;">สแกนเพื่อชำระเงิน / โอนเข้าบัญชี</p>
                    <div class="qr-placeholder">
                        [ รูป QR Code ]
                    </div>
                    <div class="promptpay-details">
                        พร้อมเพย์: 08X-XXX-XXXX<br>
                        <span style="font-size: 12px; font-weight: normal; color: #666;">ชื่อบัญชี: นายเสมียน สายเปย์</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. ข้อมูลเพื่อน และ รูป Profile
        const friends = [
            { id: 'f1', name: 'บอส', avatar: 'https://i.pravatar.cc/100?img=33' },
            { id: 'f2', name: 'เมย์', avatar: 'https://i.pravatar.cc/100?img=47' },
            { id: 'f3', name: 'เจ็ก', avatar: 'https://i.pravatar.cc/100?img=12' },
            { id: 'f4', name: 'พลอย', avatar: 'https://i.pravatar.cc/100?img=5' }
        ];

        // 2. ข้อมูลรายการอาหาร และ เครื่องดื่ม
        const items = [
            { id: 'i1', name: 'พิซซ่าเตาถ่าน', type: 'food', cost: 480, sharedBy: ['f1', 'f2', 'f3', 'f4'] },
            { id: 'i2', name: 'สปาเก็ตตี้คาร์โบนาร่า', type: 'food', cost: 220, sharedBy: ['f1', 'f2'] },
            { id: 'i3', name: 'สเต๊กเนื้อออสเตรเลีย', type: 'food', cost: 550, sharedBy: ['f3'] },
            { id: 'i4', name: 'ค็อกเทล Martini', type: 'drink', cost: 320, sharedBy: ['f2', 'f4'] },
            { id: 'i5', name: 'เบียร์สด Pitcher', type: 'drink', cost: 450, sharedBy: ['f1', 'f3'] }
        ];

        // ฟังก์ชันเริ่มทำงานเมื่อโหลดหน้าเว็บ
        function initApp() {
            renderItems();
            calculateAndRenderSummary();
        }

        // แสดงรายการอาหาร/เครื่องดื่ม พร้อมปุ่มเลือกเพื่อนที่กิน
        function renderItems() {
            const container = document.getElementById('items-container');
            container.innerHTML = '';

            items.forEach(item => {
                const categoryClass = item.type === 'food' ? 'cat-food' : 'cat-drink';
                const categoryText = item.type === 'food' ? 'Food' : 'Drink';

                let avatarsHTML = friends.map(friend => {
                    const isSelected = item.sharedBy.includes(friend.id) ? 'active' : '';
                    return `
                        <img src="${friend.avatar}" 
                             title="${friend.name}" 
                             class="select-avatar ${isSelected}" 
                             onclick="toggleShare('${item.id}', '${friend.id}')">
                    `;
                }).join('');

                const itemHTML = `
                    <div class="item-row">
                        <div class="item-header">
                            <span>
                                ${item.name} 
                                <span class="item-category ${categoryClass}">${categoryText}</span>
                            </span>
                            <span>${item.cost} ฿</span>
                        </div>
                        <div class="item-sharers">
                            <span style="font-size: 11px;">คนกิน:</span>
                            ${avatarsHTML}
                        </div>
                    </div>
                `;
                container.innerHTML += itemHTML;
            });
        }

        // ฟังก์ชันเปิด/ปิด เลือกคนกินในแต่ละรายการ
        function toggleShare(itemId, friendId) {
            const item = items.find(i => i.id === itemId);
            if (item) {
                const index = item.sharedBy.indexOf(friendId);
                if (index > -1) {
                    item.sharedBy.splice(index, 1); // เอาออก
                } else {
                    item.sharedBy.push(friendId); // เพิ่มเข้า
                }
                renderItems();
                calculateAndRenderSummary();
            }
        }

        // คำนวณยอดรวม และยอดที่แต่ละคนต้องจ่าย
        function calculateAndRenderSummary() {
            let grandTotal = 0;
            
            // เตรียมก้อนข้อมูลเก็บยอดรวมแต่ละคน
            const totals = {};
            friends.forEach(f => {
                totals[f.id] = { food: 0, drink: 0, total: 0 };
            });

            // คำนวณตามรายการ
            items.forEach(item => {
                grandTotal += item.cost;
                const sharersCount = item.sharedBy.length;
                
                if (sharersCount > 0) {
                    const costPerPerson = item.cost / sharersCount;
                    item.sharedBy.forEach(friendId => {
                        if (item.type === 'food') {
                            totals[friendId].food += costPerPerson;
                        } else {
                            totals[friendId].drink += costPerPerson;
                        }
                        totals[friendId].total += costPerPerson;
                    });
                }
            });

            // อัปเดต Total Cost รวมทั้งหมด
            document.getElementById('grand-total').innerText = `${grandTotal.toLocaleString()} ฿`;

            // แสดงผลการหารของเพื่อนแต่ละคน (Devide cost per person)
            const summaryContainer = document.getElementById('friends-summary-container');
            summaryContainer.innerHTML = '';

            friends.forEach(friend => {
                const fTotal = totals[friend.id];
                const cardHTML = `
                    <div class="person-summary-card">
                        <img src="${friend.avatar}" alt="${friend.name}">
                        <div class="person-details">
                            <div class="person-name">${friend.name}</div>
                            <div class="person-breakdown">
                                Food: ${fTotal.food.toFixed(0)} ฿ | Drink: ${fTotal.drink.toFixed(0)} ฿
                            </div>
                        </div>
                        <div class="person-total">
                            ${fTotal.total.toFixed(0)} ฿
                        </div>
                    </div>
                `;
                summaryContainer.innerHTML += cardHTML;
            });
        }

        // เริ่มการทำงานระบบ
        initApp();
    </script>
</body>
</html>
