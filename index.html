<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splitmate - Golden Hour Splitter</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FAF6EF;
      --card-bg: #FFFFFF;
      --primary-red: #A31D1D;
      --accent-red: #700B0B;
      --text-dark: #2C1810;
      --text-muted: #7A6860;
      --border-color: #E8D8CE;
      --green-paid: #2E7D32;
      --orange-pending: #E65100;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: #1A1A1A;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 0;
    }

    /* Mobile Web Container */
    .app-container {
      width: 100%;
      max-width: 430px;
      background-color: var(--bg-color);
      min-height: 844px;
      border-radius: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Header */
    .app-header {
      padding: 24px 20px 10px;
      text-align: center;
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--primary-red);
      letter-spacing: 1px;
    }

    .event-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary-red);
      text-transform: uppercase;
      line-height: 1.1;
      margin-top: 8px;
    }

    .event-meta {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 600;
    }

    /* Main Content Area */
    .content-area {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
    }

    /* Top Spender Section */
    .top-spender-card {
      background-color: var(--primary-red);
      color: white;
      border-radius: 18px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      box-shadow: 0 8px 16px rgba(163, 29, 29, 0.2);
    }

    .top-spender-avatar {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #FFF;
    }

    .top-spender-info {
      flex: 1;
    }

    .top-spender-badge {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      background-color: rgba(255, 255, 255, 0.2);
      padding: 3px 8px;
      border-radius: 10px;
      display: inline-block;
      margin-bottom: 4px;
    }

    .top-spender-name {
      font-size: 18px;
      font-weight: 700;
    }

    .top-spender-amount {
      font-size: 22px;
      font-weight: 800;
      color: #FFD700;
    }

    /* Section Headers */
    .section-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--primary-red);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    /* Friends List */
    .friend-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .friend-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .friend-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
    }

    .friend-details {
      flex: 1;
    }

    .friend-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .item-breakdown {
      display: flex;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .total-amount {
      font-size: 13px;
      font-weight: 800;
      color: var(--primary-red);
      margin-top: 2px;
    }

    /* Status Checkbox Button */
    .status-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .status-btn.pending {
      background-color: #FFF3E0;
      color: var(--orange-pending);
      border: 1px solid #FFE0B2;
    }

    .status-btn.paid {
      background-color: #E8F5E9;
      color: var(--green-paid);
      border: 1px solid #C8E6C9;
    }

    .status-btn input {
      display: none;
    }

    /* Payment Section */
    .payment-card {
      background-color: var(--card-bg);
      border: 2px dashed var(--primary-red);
      border-radius: 18px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
    }

    .payment-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .payment-clerk {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .qr-placeholder {
      width: 120px;
      height: 120px;
      background-color: #EEE;
      margin: 0 auto;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--text-muted);
      border: 1px solid #DDD;
    }

    /* Event Logs & Actions */
    .action-btn {
      width: 100%;
      background-color: var(--primary-red);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .logs-container {
      background: #FFF;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      max-height: 120px;
      overflow-y: auto;
      font-size: 12px;
    }

    .log-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #F0F0F0;
    }
    .log-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- App Header -->
    <header class="app-header">
      <div class="brand-title">SPLITMATE</div>
      <div class="event-title" id="event-title">GOLDEN HOUR DINNER</div>
      <div class="event-meta">
        <span id="event-date">Oct 24, 2026</span> • Clerk: <span id="event-clerk">Alex</span>
      </div>
    </header>

    <div class="content-area">
      <!-- Top Spender Highlight -->
      <div class="top-spender-card">
        <img id="top-spender-img" class="top-spender-avatar" src="https://i.pravatar.cc/150?img=3" alt="Top Spender">
        <div class="top-spender-info">
          <span class="top-spender-badge">👑 Top Spender</span>
          <div class="top-spender-name" id="top-spender-name">-</div>
          <div class="top-spender-amount" id="top-spender-amount">฿0.00</div>
        </div>
      </div>

      <!-- Friends List -->
      <div class="section-title">Friends Breakdown</div>
      <div class="friend-list" id="friend-list">
        <!-- JS will populate cards here -->
      </div>

      <!-- Payment Section -->
      <div class="payment-card">
        <div class="payment-title">Scan to Pay via PromptPay</div>
        <div class="payment-clerk">Account: 081-234-5678 (Alex)</div>
        <div class="qr-placeholder">
          PromptPay QR Code
        </div>
      </div>

      <!-- Event Log Controls -->
      <button class="action-btn" onclick="saveEventLog()">💾 Save Event Log</button>
      
      <div class="section-title" style="margin-top: 15px;">Saved Event Logs</div>
      <div class="logs-container" id="logs-list">
        <div style="color: var(--text-muted); text-align: center;">No logs saved yet.</div>
      </div>
    </div>
  </div>

  <script>
    // Sample Data
    const eventData = {
      title: "GOLDEN HOUR DINNER",
      date: "Oct 24, 2026",
      clerk: "Alex",
      friends: [
        { id: 1, name: "Sarah", avatar: "https://i.pravatar.cc/150?img=5", food: 450, drink: 200, paid: false },
        { id: 2, name: "David", avatar: "https://i.pravatar.cc/150?img=12", food: 850, drink: 400, paid: true },
        { id: 3, name: "Emma", avatar: "https://i.pravatar.cc/150?img=9", food: 300, drink: 150, paid: false },
        { id: 4, name: "Michael", avatar: "https://i.pravatar.cc/150?img=11", food: 500, drink: 250, paid: false }
      ]
    };

    // Render Friends List and Calculate Breakdown
    function renderFriends() {
      const friendListEl = document.getElementById('friend-list');
      friendListEl.innerHTML = '';

      let topSpender = null;
      let maxTotal = -1;

      eventData.friends.forEach(friend => {
        const total = friend.food + friend.drink;

        // Find Top Spender
        if (total > maxTotal) {
          maxTotal = total;
          topSpender = { ...friend, total };
        }

        // Card Element
        const card = document.createElement('div');
        card.className = 'friend-card';
        card.innerHTML = `
          <img class="friend-avatar" src="${friend.avatar}" alt="${friend.name}">
          <div class="friend-details">
            <div class="friend-name">${friend.name}</div>
            <div class="item-breakdown">
              <span>Food: ฿${friend.food}</span> | 
              <span>Drink: ฿${friend.drink}</span>
            </div>
            <div class="total-amount">Total: ฿${total.toLocaleString()}</div>
          </div>
          <label class="status-btn ${friend.paid ? 'paid' : 'pending'}" id="status-label-${friend.id}">
            <input type="checkbox" ${friend.paid ? 'checked' : ''} onchange="togglePaid(${friend.id})">
            <span id="status-text-${friend.id}">${friend.paid ? '✓ Paid' : '⏳ Pending'}</span>
          </label>
        `;
        friendListEl.appendChild(card);
      });

      // Update Top Spender Card
      if (topSpender) {
        document.getElementById('top-spender-name').innerText = topSpender.name;
        document.getElementById('top-spender-amount').innerText = `฿${topSpender.total.toLocaleString()}`;
        document.getElementById('top-spender-img').src = topSpender.avatar;
      }
    }

    // Toggle Checkbox Status (Pending / Paid)
    function togglePaid(friendId) {
      const friend = eventData.friends.find(f => f.id === friendId);
      if (friend) {
        friend.paid = !friend.paid;
        
        const label = document.getElementById(`status-label-${friendId}`);
        const textSpan = document.getElementById(`status-text-${friendId}`);

        if (friend.paid) {
          label.className = 'status-btn paid';
          textSpan.innerText = '✓ Paid';
        } else {
          label.className = 'status-btn pending';
          textSpan.innerText = '⏳ Pending';
        }
      }
    }

    // Save Event Logs to LocalStorage
    function saveEventLog() {
      let logs = JSON.parse(localStorage.getItem('splitmate_logs') || '[]');
      const newLog = {
        title: eventData.title,
        date: eventData.date,
        totalAmount: eventData.friends.reduce((sum, f) => sum + f.food + f.drink, 0),
        savedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };
      logs.unshift(newLog);
      localStorage.setItem('splitmate_logs', JSON.stringify(logs));
      renderLogs();
      alert('Event log saved successfully!');
    }

    // Render Saved Logs
    function renderLogs() {
      const logsEl = document.getElementById('logs-list');
      let logs = JSON.parse(localStorage.getItem('splitmate_logs') || '[]');
      
      if (logs.length === 0) {
        logsEl.innerHTML = '<div style="color: var(--text-muted); text-align: center;">No logs saved yet.</div>';
        return;
      }

      logsEl.innerHTML = logs.map(log => `
        <div class="log-item">
          <div>
            <strong>${log.title}</strong>
            <div style="font-size: 10px; color: var(--text-muted);">${log.date} at ${log.savedAt}</div>
          </div>
          <div style="font-weight: 700; color: var(--primary-red);">฿${log.totalAmount.toLocaleString()}</div>
        </div>
      `).join('');
    }

    // Initial Load
    renderFriends();
    renderLogs();
  </script>
</body>
</html>
